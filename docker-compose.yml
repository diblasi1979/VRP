services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    ports:
      - "8009:8009"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8009
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    command: ["sh", "./docker/entrypoint.sh"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8009
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5100:5100"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command:
      - sh
      - -lc
      - npm install && npm run dev -- --host 0.0.0.0 --port 5100

volumes:
  backend_vendor:
  frontend_node_modules: